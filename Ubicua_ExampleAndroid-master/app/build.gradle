plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.apppecl3'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.apppecl3"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packagingOptions {
        // Excluye archivos duplicados de metadatos para solucionar el conflicto de Netty
        resources.excludes.add("META-INF/INDEX.LIST")
        resources.excludes.add("META-INF/io.netty.versions.properties")
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0' 
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation("com.squareup.retrofit2:retrofit:2.9.0")
    implementation("com.squareup.retrofit2:converter-gson:2.9.0")
    implementation 'com.hivemq:hivemq-mqtt-client:1.3.1'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0' // <-- DEPENDENCIA DEL GRÁFICO AÑADIDA
}